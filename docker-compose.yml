services:
  birthday-totem:
    build: .
    restart: unless-stopped
    environment:
      MAYA_DB_PATH: /app/data/maya_calendar.db
      MAYA_ADMIN_TOKEN: ${MAYA_ADMIN_TOKEN:-please-change-this-token}
      MAYA_ENABLE_ANALYTICS: ${MAYA_ENABLE_ANALYTICS:-0}
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
